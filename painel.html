<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#151311">
<title>Painel da escuta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--muro:#151311;--muro2:#211d1a;--tinta:#fff7e8;--suave:#cfc4b2;--amarelo:#ffc629;--laranja:#ff6b2c;--rosa:#ff3d7f;--verde:#2bb673;--linha:#3a332d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--muro);color:var(--tinta)}
body{font-family:Rubik,system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1,h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.5px;line-height:1;margin:0}
h1{font-size:48px;color:var(--amarelo);margin:8px 0}
h2{font-size:30px;margin:0 0 4px}
.aviso{background:var(--muro2);border-left:4px solid var(--rosa);padding:10px 12px;border-radius:8px;font-size:15px;color:var(--suave)}
form{display:grid;gap:12px;margin:16px 0}
label{display:grid;gap:6px;font-weight:500}
input[type=password]{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--linha);background:#0f0d0c;color:var(--tinta)}
.check{display:flex;gap:10px;align-items:center;font-weight:400}
.check input{width:24px;height:24px;accent-color:var(--amarelo)}
button{font:inherit;cursor:pointer}
.btn{min-height:54px;border:0;border-radius:14px;font-weight:700;font-size:19px;padding:12px 16px}
.btn-p{background:var(--amarelo);color:#1a1200}
.btn-s{background:transparent;border:2px solid var(--linha);color:var(--tinta)}
.linha-botoes{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.linha-botoes .btn{flex:1 1 160px}
#msg{margin:10px 0;color:var(--suave)}
.numero{font-family:"Bebas Neue",Impact,sans-serif;font-size:72px;line-height:1;color:var(--amarelo)}
.bloco{background:var(--muro2);border:2px solid var(--linha);border-radius:16px;padding:14px;margin:14px 0}
.base{font-size:14px;color:var(--suave);margin:0 0 10px}
.barra{margin:8px 0}
.barra .rot{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.barra .rot span:last-child{white-space:nowrap;color:var(--suave)}
.barra.empilhada .rot{flex-direction:column;gap:2px}
.barra.empilhada .rot span:last-child{white-space:normal}
.barra .trilho{height:12px;background:#0f0d0c;border-radius:99px;overflow:hidden;margin-top:4px}
.barra .trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--amarelo),var(--laranja))}
.fala{border-left:3px solid var(--verde);padding:6px 10px;margin:8px 0;background:#191613;border-radius:6px}
.fala small{display:block;color:var(--suave);font-size:12px;margin-top:4px}
.vazio{color:var(--suave);font-style:italic}
.alerta{background:var(--rosa);color:#fff;font-weight:700;padding:8px 10px;border-radius:8px;margin:0 0 10px}
.filtro{display:grid;gap:6px;margin:8px 0 4px;font-weight:500}
.filtro select{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--linha);background:#0f0d0c;color:var(--tinta)}
.demo-aviso{background:var(--rosa);color:#fff;font-weight:700;padding:10px 12px;border-radius:10px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel da escuta</h1>
  <p class="aviso">Só para quem cuida das respostas. Antes de divulgar qualquer frase, tire nomes, apelidos, endereços e detalhes que permitam saber quem falou. Divulgue sempre números somados.</p>
  <p class="demo-aviso" id="demo-aviso" hidden>EXEMPLO COM DADOS INVENTADOS. Nada disto é resposta real.</p>

  <form id="entrar">
    <label>Senha do painel
      <input type="password" id="chave" autocomplete="current-password" required>
    </label>
    <label class="check"><input type="checkbox" id="lembrar"> Lembrar a senha só enquanto esta aba estiver aberta</label>
    <button class="btn btn-p" type="submit">Ver respostas</button>
  </form>
  <div id="msg"></div>

  <section id="resultado" hidden>
    <div class="numero" id="n">0</div>
    <div>respostas até agora</div>
    <p class="aviso" id="cautela"></p>
    <div class="linha-botoes">
      <button class="btn btn-p" id="copiar" type="button">Copiar resumo</button>
      <button class="btn btn-s" id="atualizar" type="button">Atualizar</button>
    </div>
    <label class="check"><input type="checkbox" id="ver-piloto"> Mostrar respostas do piloto (marcadas como teste)</label>
    <label class="filtro" id="filtro-bairro" hidden>Bairro
      <select id="bairro-sel"></select>
    </label>
    <div id="blocos"></div>
  </section>
</div>

<script src="bairros.js?v=5"></script>
<script>
/* mesma URL do Apps Script usada no index.html */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxWutlNNs9DBleWporYzgdAvXfSzCzRM2ow4xdyfvMPuPintMMF_gqKim_zjQnr7bQ/exec";

// "chave" diferencia blocos que contam o mesmo campo com filtros diferentes
const CONTAGENS = [
  { id:"temas", titulo:"Temas que as pessoas quiseram aprofundar", multi:true },
  { id:"pedido", titulo:"O pedido número um para a Câmara" },
  { id:"contas", titulo:"Contas e comida: o que mais aperta", multi:true },
  { id:"seguranca", titulo:"Segurança: o que deixa inseguro", multi:true },
  { id:"seguranca_hora", titulo:"Segurança: horário" },
  { id:"saude", titulo:"Saúde: o que mais falta", multi:true },
  { id:"cultura", titulo:"Cultura, esporte e lazer: o que mais falta", multi:true },
  { id:"escritura", titulo:"Escritura e moradia: situação da casa" },
  { id:"escritura_trava", titulo:"O que trava a regularização", multi:true },
  { id:"rua", titulo:"Rua, calçada e iluminação: o que precisa", multi:true },
  { id:"idade", titulo:"Faixa de idade" },
  { id:"genero", titulo:"Gênero" },
  { id:"relacao", titulo:"Ligação com o bairro" },
  { id:"origem", titulo:"Por onde chegou", nomes:{ zap:"WhatsApp", face:"Facebook", insta:"Instagram", cartaz:"Cartaz (QR code)", entrevista:"Entrevistadores", link:"Link direto", teste:"Teste (piloto)" } },
  { id:"entrevistador", titulo:"Entrevistas por voluntário" }
];
const FALAS = [
  { id:"rua_trecho_texto", titulo:"Trechos de rua citados" },
  { id:"ideia_texto", titulo:"Ideias para o bairro" },
  { id:"pedido_texto", titulo:"Outros pedidos à Câmara" },
  { id:"escritura_trava_texto", titulo:"O que trava a regularização, nas palavras das pessoas" },
  { id:"relacao_texto", titulo:"Outra ligação com o bairro" }
];

const $ = id => document.getElementById(id);
const seguro = (fn, p) => { try { return fn(); } catch(e) { return p; } };
let linhas = [], todas = [], filtroBairro = "";
const bairroDe = l => l.bairro || "centreville";   // respostas antigas são todas do Centre Ville
const nomeBairro = id => ((window.BAIRROS || {})[id] || {}).nome || id;

function contar(c){
  const base = c.filtro ? linhas.filter(c.filtro) : linhas;
  const resp = base.filter(l => String(l[c.id]||"").trim());
  const conta = {};
  resp.forEach(l => String(l[c.id]).split(" | ").forEach(v => {
    v = v.trim(); if(v) conta[v] = (conta[v]||0) + 1;
  }));
  return { base: base.length, resp: resp.length, itens: Object.entries(conta).sort((a,b) => b[1]-a[1]) };
}

// tempo para responder: mediana em segundos (ignora tempos absurdos, como aba esquecida aberta)
function tempoMediano(){
  const t = linhas.map(l => Number(l.duracao_seg)).filter(x => x > 0 && x < 3600).sort((a, b) => a - b);
  if(!t.length) return null;
  const m = t.length % 2 ? t[(t.length - 1) / 2] : (t[t.length / 2 - 1] + t[t.length / 2]) / 2;
  return { seg: Math.round(m), n: t.length };
}
const minSeg = s => `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`;
// combinado em 09/10: se metade levar mais de 5 minutos, cortamos perguntas
const LIMITE_SEG = 300;
const regraTempo = tm => tm.n < 10 ? "Combinado: se metade levar mais de 5 minutos, cortamos perguntas. Ainda são poucas respostas com tempo medido."
  : tm.seg > LIMITE_SEG ? "Passou de 5 minutos: pelo combinado, é hora de cortar perguntas."
  : "Dentro do combinado: metade termina em até 5 minutos.";

// motivos de quem não votou em dois grupos: dificuldade prática ou descrédito
// (os rótulos antigos ficam na lista para as respostas do piloto)
const DESCREDITO = ["Não me interesso por política","Não acredito em nenhum candidato","Não acredito mais na política","Desânimo, não acredito mais"];
const PRATICOS = ["Distância ou falta de condução","Não sabia onde votar","Estava trabalhando ou sem tempo","Estava trabalhando","Saúde, idade ou dificuldade de andar","Problema com título ou documento","Cuidando de criança ou familiar","Estava fora da cidade"];
const naoVotou = l => l.votou === "Não votei" || l.votou === "Justifiquei";
const disseSeVotou = l => l.votou === "Sim, votei" || naoVotou(l);
const motivosDe = l => String(l.motivos || "").split(" | ").map(v => v.trim()).filter(Boolean);
const porDescredito = l => motivosDe(l).some(m => DESCREDITO.includes(m));
const porPratica = l => motivosDe(l).some(m => PRATICOS.includes(m));

function gruposMotivos(){
  const nv = linhas.filter(l => naoVotou(l) && motivosDe(l).length);
  return { n: nv.length, itens: [
    ["Só dificuldade prática", nv.filter(l => porPratica(l) && !porDescredito(l)).length],
    ["Só descrédito ou desinteresse", nv.filter(l => porDescredito(l) && !porPratica(l)).length],
    ["Os dois", nv.filter(l => porPratica(l) && porDescredito(l)).length],
    ["Só outro motivo", nv.filter(l => !porPratica(l) && !porDescredito(l)).length]
  ].filter(([, q]) => q) };
}

// hipótese a testar: jovens e quem chegou depois deixam mais de votar, por descrédito
const ORDEM_IDADE = ["16 a 24","25 a 34","35 a 59","60 ou mais"];
const ORDEM_TEMPO = ["Sou da ocupação ou nasci aqui","Cheguei depois, há mais de 10 anos","Cheguei há menos de 10 anos","Não moro, mas trabalho ou tenho família aqui"];
function cruzar(campo, ordem){
  const base = linhas.filter(disseSeVotou);
  return ordem.map(g => {
    const gl = base.filter(l => l[campo] === g);
    return { g, n: gl.length, nv: gl.filter(naoVotou).length, desc: gl.filter(l => naoVotou(l) && porDescredito(l)).length };
  }).filter(x => x.n);
}

function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function barra(rot, txt, frac, empilhar){
  const d = el("div", empilhar ? "barra empilhada" : "barra");
  const t = el("div", "rot"); t.appendChild(el("span", null, rot)); t.appendChild(el("span", null, txt));
  const tr = el("div", "trilho"); const i = el("i"); i.style.width = (100 * frac) + "%"; tr.appendChild(i);
  d.appendChild(t); d.appendChild(tr); return d;
}
function blocosNaoVoto(box){
  const gm = gruposMotivos();
  if(gm.n){
    const b = el("div", "bloco");
    b.appendChild(el("h2", null, "Por que não votou: dificuldade prática ou descrédito?"));
    b.appendChild(el("p", "base", `${gm.n} pessoas que não votaram disseram o motivo.${gm.n < 20 ? " Poucas respostas: use como pista." : ""}`));
    gm.itens.forEach(([rot, q]) => b.appendChild(barra(rot, `${q} de ${gm.n}`, q / gm.n)));
    box.appendChild(b);
  }
  [["idade", ORDEM_IDADE, "Quem não votou, por idade", "Hipótese a testar: os jovens e quem chegou depois deixam mais de votar, por descrédito. Conta só quem disse se votou."],
   ["relacao", ORDEM_TEMPO, "Quem não votou, por tempo de bairro", "A mesma conta, separando quem é da ocupação de quem chegou depois."]
  ].forEach(([campo, ordem, titulo, nota]) => {
    const linhasG = cruzar(campo, ordem);
    if(!linhasG.some(x => x.nv)) return;
    const total = linhasG.reduce((s, x) => s + x.n, 0);
    const b = el("div", "bloco");
    b.appendChild(el("h2", null, titulo));
    b.appendChild(el("p", "base", `${nota} "Por descrédito" é quem marcou desinteresse ou descrédito entre os motivos.${total < 20 ? " Poucas respostas: use como pista." : ""}`));
    linhasG.forEach(x => b.appendChild(barra(x.g, `${x.nv} de ${x.n} não votaram${x.nv ? ` · ${x.desc} por descrédito` : ""}`, x.nv / x.n, true)));
    box.appendChild(b);
  });
}

function desenhar(){
  const n = linhas.length;
  $("n").textContent = n;
  const piloto = linhas.filter(ehPiloto).length;
  $("cautela").textContent = (piloto ? `Inclui ${piloto} resposta(s) do piloto (teste). ` : "")
    + (vazias ? `${vazias} pessoa(s) abriram e pularam tudo; não entram nas contas. ` : "") + (n < 30
    ? "Ainda são poucas respostas. Use como pista, não como conclusão. É uma escuta voluntária: mostra quem respondeu, não o bairro todo."
    : "É uma escuta voluntária: mostra quem respondeu, não o bairro todo. Ao divulgar, diga sempre quantas pessoas responderam.");
  const box = $("blocos"); box.innerHTML = "";
  const tm = tempoMediano();
  if(tm){
    const b = el("div", "bloco");
    b.appendChild(el("h2", null, "Tempo para responder"));
    b.appendChild(el("p", "base", `Metade respondeu em até ${minSeg(tm.seg)} (de ${tm.n} respostas com tempo medido). A promessa no site é de uns 4 minutos.`));
    b.appendChild(el("p", tm.n >= 10 && tm.seg > LIMITE_SEG ? "alerta" : "base", regraTempo(tm)));
    box.appendChild(b);
  }

  CONTAGENS.forEach(c => {
    const r = contar(c);
    // logo depois de "Por que não votou" entram os blocos da hipótese, mesmo sem motivos marcados
    if(!r.itens.length){ if(c.id === "motivos") blocosNaoVoto(box); return; }
    const b = el("div", "bloco");
    b.appendChild(el("h2", null, c.titulo));
    b.appendChild(el("p", "base", `${r.resp} responderam${c.base ? " (" + c.base + ")" : ""}${c.multi ? ". Cada pessoa pôde marcar mais de uma." : "."}${r.resp < 20 ? " Poucas respostas: use como pista." : ""}`));
    r.itens.forEach(([rot, q]) => b.appendChild(barra(c.nomes ? (c.nomes[rot] || rot) : rot, `${q} de ${r.resp}`, q / Math.max(r.resp, 1))));
    box.appendChild(b);
    if(c.id === "motivos") blocosNaoVoto(box);
  });

  FALAS.forEach(f => {
    const lista = linhas.filter(l => String(l[f.id]||"").trim()).reverse();
    const b = el("div", "bloco");
    b.appendChild(el("h2", null, f.titulo));
    b.appendChild(el("p", "base", `${lista.length} falas. As mais novas primeiro.`));
    if(!lista.length) b.appendChild(el("p", "vazio", "Nada ainda."));
    lista.forEach(l => {
      const q = el("div", "fala", l[f.id]);
      // só o dia: hora e idade junto da fala ajudariam a reconhecer quem falou
      const dia = /^\d{4}-\d{2}-\d{2}T/.test(l.quando)
        ? new Date(l.quando).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"})
        : String(l.quando || "").slice(0, 5);
      q.appendChild(el("small", null, dia));
      b.appendChild(q);
    });
    box.appendChild(b);
  });
}

function resumo(){
  const n = linhas.length, hoje = new Date().toLocaleDateString("pt-BR");
  const prefixo = (DEMO ? ["(EXEMPLO COM DADOS INVENTADOS)"] : []).concat(["RESUMO INTERNO DO COMITÊ · não publicar como está"]);
  const top = (id, k=3) => {
    const r = contar(CONTAGENS.find(x => x.id === id));
    return r.itens.slice(0,k).map(([rot,q]) => `${rot} (${q} de ${r.resp})`).join("; ") || "sem respostas";
  };
  const tm = tempoMediano();
  return [...prefixo,
    `Fala, Centre Ville! 2ª escuta · resumo de ${hoje}`,
    `${n} respostas. Escuta voluntária: mostra quem respondeu, não o bairro todo.`,
    `Temas escolhidos: ${top("temas", 6)}.`,
    `Pedido número um para a Câmara: ${top("pedido")}.`,
    `Contas: ${top("contas")}.`,
    `Segurança: ${top("seguranca")}.`,
    `Saúde: ${top("saude")}.`,
    `Cultura e esporte: ${top("cultura")}.`,
    `Escrituras, o que trava: ${top("escritura_trava")}.`,
    `Rua e iluminação: ${top("rua")}.`,
    ...(tm ? [`Tempo mediano para responder: ${minSeg(tm.seg)}.`] : [])
  ].join("\n");
}

// piloto: respostas marcadas como teste feitas na versão atual do questionário
// (os testes técnicos antigos ficam sempre de fora)
let brutas = [], vazias = 0;
// "pulou tudo": marcada pelo site ou sem nenhuma resposta (vale para as antigas também)
const CAMPOS_RESPOSTA = ["relacao","relacao_texto","temas","contas","seguranca","seguranca_hora","saude","cultura","escritura","escritura_trava","escritura_trava_texto","rua","rua_trecho_texto","pedido","pedido_texto","ideia_texto","idade","genero"];
const ehVazia = l => l.vazia === "sim" || !CAMPOS_RESPOSTA.some(c => String(l[c] || "").trim());
const ehPiloto = l => l.origem === "teste" && /^\d{4}-\d{2}-\d{2}-v([3-9]|\d\d)/.test(l.versao || "");
function montarTodas(){
  const comPiloto = $("ver-piloto").checked;
  const validas = brutas.filter(l => l.origem !== "teste" || (comPiloto && ehPiloto(l)));
  vazias = validas.filter(ehVazia).length;
  todas = validas.filter(l => !ehVazia(l));
}

function prepararFiltro(){
  const ids = [...new Set(todas.map(bairroDe))];
  if(ids.length < 2){ $("filtro-bairro").hidden = true; filtroBairro = ""; return; }
  const sel = $("bairro-sel"); sel.innerHTML = "";
  [["", "Todos os bairros"], ...ids.map(id => [id, nomeBairro(id)])].forEach(([v, t]) => {
    const o = el("option", null, t); o.value = v; sel.appendChild(o);
  });
  sel.value = ids.includes(filtroBairro) ? filtroBairro : "";
  filtroBairro = sel.value;
  $("filtro-bairro").hidden = false;
}

function aplicarFiltro(){
  linhas = filtroBairro ? todas.filter(l => bairroDe(l) === filtroBairro) : todas.slice();
  desenhar();
}

async function carregar(chave){
  if(!ENDPOINT){ $("msg").textContent = "O painel ainda não foi ligado à planilha (falta a URL do Apps Script)."; return; }
  $("msg").textContent = "Carregando…";
  try{
    const r = await fetch(ENDPOINT, { method:"POST", body: JSON.stringify({ acao:"painel", chave }) });
    const j = await r.json();
    if(j.erro){ $("msg").textContent = j.erro; return; }
    brutas = j.linhas || [];
    montarTodas();
    $("msg").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) + ".";
    $("entrar").hidden = true; $("resultado").hidden = false;
    prepararFiltro(); aplicarFiltro();
  }catch(e){
    $("msg").textContent = "Não consegui carregar. Confira a internet e tente de novo.";
  }
}

$("entrar").onsubmit = ev => {
  ev.preventDefault();
  const chave = $("chave").value;
  // a senha nunca fica gravada no aparelho: no máximo enquanto a aba estiver aberta
  if($("lembrar").checked) seguro(() => sessionStorage.setItem("cv_chave_painel", chave));
  else seguro(() => sessionStorage.removeItem("cv_chave_painel"));
  carregar(chave);
};
$("atualizar").onclick = () => DEMO ? aplicarFiltro() : carregar($("chave").value);
$("bairro-sel").onchange = () => { filtroBairro = $("bairro-sel").value; aplicarFiltro(); };
$("ver-piloto").onchange = () => { montarTodas(); prepararFiltro(); aplicarFiltro(); };
$("copiar").onclick = async () => {
  const t = resumo();
  try{ await navigator.clipboard.writeText(t); $("msg").textContent = "Resumo copiado. É só colar no WhatsApp."; }
  catch(e){ prompt("Copie o resumo:", t); }
};

/* ===== EXEMPLO: painel.html?demo=1 mostra dados inventados, para treinar ===== */
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

function dadosDemo(){
  let semente = 7;
  const r = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
  const um = a => a[Math.floor(r()*a.length)];
  const T = ["Preço das contas e da comida","Segurança","Saúde","Cultura, esporte e lazer","Escritura e moradia","Rua, calçada e iluminação"];
  const linhasDemo = [];
  for(let i=0; i<24; i++){
    const t = um(T);
    const l = { quando: new Date(Date.UTC(2026, 10, 1 + Math.floor(i/12), 12 + (i % 9), (i*7) % 60)).toISOString(), bairro:"centreville",
      modo:"autopreenchimento", origem: um(["zap","insta","face"]), temas:t, duracao_seg: 100 + Math.floor(r()*160),
      relacao: um(["Sou da ocupação ou nasci aqui","Cheguei depois, há mais de 10 anos","Cheguei há menos de 10 anos"]),
      idade: um(["16 a 24","25 a 34","35 a 59","60 ou mais"]), genero: um(["Mulher","Homem"]) };
    if(t===T[0]) l.contas = um(["Conta de luz","Mercado","Gás"]);
    if(t===T[1]){ l.seguranca = um(["Rua escura","Assalto ou furto"]); l.seguranca_hora = um(["Noite","Madrugada"]); }
    if(t===T[2]) l.saude = um(["Consulta e fila no posto","Dentista"]);
    if(t===T[3]) l.cultura = um(["Curso e oficina","Aula de esporte"]);
    if(t===T[4]){ l.escritura = "Não tenho escritura"; l.escritura_trava = um(["Custo","Documentação"]); }
    if(t===T[5]){ l.rua = um(["Iluminação","Asfalto ou buraco"]); l.rua_trecho_texto = "Exemplo inventado: rua de baixo"; }
    l.pedido = l.contas || l.seguranca || l.saude || l.cultura || l.rua || "Regularizar as escrituras";
    linhasDemo.push(l);
  }
  return linhasDemo;
}
